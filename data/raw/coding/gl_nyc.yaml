note: >-
  The exact MIRROR of Chicago. The 'No laboratory monitoring is needed' sentence
  sits in Dosing and Prescribing, right after the instruction to obtain NAAT at
  exposure sites and syphilis serology at baseline and 3-6 months — it answers the
  safety-bloodwork question (the LFT/CMP/CBC Chicago mandates from the package
  insert), so it is host_toxicity_labs=explicitly_none, NOT a decision about
  microbiological surveillance. Reading it as a refusal to monitor staph would
  attribute a consideration the sentence does not show (PI adjudication 2026-08-19,
  stricter reading). So: Chicago orders host labs and never mentions resistance;
  NYC names staph in the counselling script and waives host labs. Both fail to
  touch the organism, from opposite directions. NYC also states the population
  bearing any resistance/microbiome burden is the one 'doxy-PEP will be most used'
  in, then defers to evaluations 'planned or underway' (p. 2).
