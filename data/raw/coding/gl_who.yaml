note: >-
  APEX (global) unit and the NEAR-EXCEPTION to the asymmetry. WHO comes closest to
  bystander AMR monitoring: it 'strongly encourages context-appropriate monitoring
  of antimicrobial resistance' including in 'other pathogens and the microbiome' —
  the broadest such language in the corpus — but it is generic (S. aureus never
  named) and 'encouraged', not required. Coded s_aureus_monitoring=silent because
  it is not S. aureus-specific; the note records that the narrowing to
  in-category-only (or nothing) happens DOWNSTREAM (CDC -> US cities), i.e. the
  apex guideline is the most expansive and each level below it contracts the
  bystander frame — a propagation-of-narrowing finding.
  GRADING CONTRAST (v2 schema does not capture; flag to PI): WHO GRADE'd the AMR
  evidence — 'no effect on tetracycline resistance to N. gonorrhoeae (RR 1.00;
  low certainty)', AMR effects 'uncertain' — i.e. it graded the harms/AMR question
  (as low certainty), UNLIKE CDC which left harms 'not graded'. Consider re-adding
  graded-efficacy / graded-harms fields to v2 to capture the CDC-vs-WHO contrast.
  WHO reference list also supplies DOIs for missing trials: Luetkemeyer 2025 Lancet
  ID final (10.1016/S1473-3099(25)00085-4); DOXYVAC main (10.1016/S1473-3099(24)00236-6).
  VERIFICATION (2026-08-19): exhaustive staph keyword search of source
  (SHA-256 b4154b68f43e4521d349be04d9362847bbceb7a1469bb06baf3a549c12056e02)
  found S. aureus exactly ONCE — in the reference list (the Soge citation, p. 17) —
  and ZERO MRSA/methicillin/MSSA/tetK/tetM/SSTI. So WHO, like Philadelphia, cites
  the paper that documented tetracycline-resistant S. aureus colonization yet never
  carries it into the recommendation or monitoring. Corrected from an initial
  'absent' miscoding that a plain grep missed. See guidelines/CHECKSUMS.md.
