literature_search_provenance: >-
  The document cites only the trial literature (Luetkemeyer 2023, Molina 2024, plus two
  2025 doxy-PEP-in-women studies). It does NOT cite San Francisco's own USA300-in-MSM
  outbreak literature (Diep 2008, Ann Intern Med) — the very source de Jong 2025 Table 1
  uses to classify SF as a documented CA-MRSA/MSM cluster. The bystander concern is most
  epidemiologically grounded in this jurisdiction and least instrumented by its guidance.
