note: >-
  The lineage SEED. Detroit (gl_detroit) and LA County (gl_la_county) both state their
  protocols are adapted from "San Francisco City Clinic" — this is the updated 5/2026
  version of that origin document. Coded blind: bystander named only as generic
  "microbiome and antibiotic resistance ... being studied" (NOT S. aureus); S. aureus /
  staph / MRSA absent from the whole document; monitoring silent (only GC/CT/syphilis/HIV
  every 3 months). Unlike Detroit it does not even order host-toxicity labs. Defers to
  CDC only for STI TREATMENT ("treated according to standard CDC STI treatment
  guidelines"), NOT for its doxy-PEP prescribing/monitoring policy, which is substantive
  and independent — this is an independent decline, not a defer-to-CDC echo.
