# USA300-in-MSM outbreak jurisdiction (Diep 2008, cited by de Jong 2025 Table 1), so it
# is the single most load-bearing member of the outbreak-anchored denominator, and it
# was on disk but uncoded. Governmental: SF Department of Public Health / SF City Clinic
# (contact alyson.decker@sfdph.org; sf.gov/cityclinic). Coded from full document text.
