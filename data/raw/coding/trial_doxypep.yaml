  # ---------- CDC MMWR (guideline): phenotype provenance RESOLVED; denominator open --
  # 2026-08-19 update, after obtaining the NEJM Supplementary Appendix + Protocol:
  # The phenotype question is resolved. NEJM (main text AND appendix, both checked)
  # publishes NO tetracycline-S.-aureus number — S. aureus is reported only as
  # DOXYCYCLINE resistance (Appendix Table 2). The pre-specified endpoint (Protocol +
  # NEJM Methods) WAS tetracycline. So CDC's "tetracycline-resistant S. aureus" label
  # is faithful to the pre-specified/CROI endpoint, not an error, and by construction
  # cannot map onto any NEJM table. What remains open is only the exact 428/222
  # denominator, which lives in the CROI 2023 abstract (not yet in hand). Do NOT
  # assert CDC error; the divergence is the trial's own endpoint switch, documented
  # in resistance_endpoint_switched above.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: baseline
    organism: s_aureus
    phenotype_measured: not_stated
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 20
    denominator: 428
    denominator_basis: unclear
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 6 (Potential Resistance in Commensals)"
    note: >-
      CDC prints 'tetracycline-resistant S. aureus ... from 5% [20 of 428]'.
      phenotype_measured = not_stated: CDC does not state the assay, but the label
      'tetracycline' matches the PRE-SPECIFIED endpoint (Protocol L253/258/280/498/
      527; NEJM Methods p.1297), which NEJM did NOT publish — S. aureus appears in
      NEJM only as DOXYCYCLINE resistance (Appendix Table 2, verified). So the figure
      provenance is the CROI 2023 abstract / pre-specified tetracycline analysis, NOT
      NEJM, and cannot map onto any NEJM table by construction. RESOLVED: not a CDC
      error — the divergence is the trial's own endpoint switch. OPEN: the exact
      428 denominator (colonized vs swab-count) still lives in the CROI abstract,
      not yet in hand. Do NOT assert an error.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: month12
    organism: s_aureus
    phenotype_measured: not_stated
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 28
    denominator: 222
    denominator_basis: unclear
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 6"
    note: >-
      CDC: 'to 13% [28 of 222]'. Phenotype provenance RESOLVED as the baseline row:
