# Stream A coded trial — DoxyPEP (Luetkemeyer 2023). First-pass (claude-firstpass);
# needs PI verification + double-coding (Phase F). Values quoted (YAML booleans).
#
# NEJM measured DOXYCYCLINE resistance in S. aureus (ETEST, MIC >=16 ug/mL); the
# relabel to "tetracycline" happens downstream (Szondy's table title, CDC). NEJM
# S. aureus counts are read from Fig 4B stacked bars (bar = % isolated of swabbed;
# dark = % doxy-resistant) and cross-check against the text percentages exactly:
# baseline 215/483=45%, 25/215=12%; doxy mo12 31/111=28%, 5/31=16%, 5/111=5%;
# SC mo12 24/51=47%, 2/24=8%. See DECISIONS.md.
#
# 2026-08-19 — Supplementary Appendix + Protocol obtained (both hashed). The Fig 4B
# reading is now CONFIRMED against Appendix Table 2 ("doxycycline resistance in
# S. aureus isolates"), Total column: baseline 12/139 & 13/76; mo6 11/51 & 3/29;
# mo12 5/31 & 2/24 — exact. TWO new primary-source findings recorded below:
#   (1) data_availability = No (the data-sharing statement withholds all data). This
#       is the unassailable spine and does not depend on (2).
#   (2) saureus_endpoint_label_mismatch = yes. The S. aureus assay was DOXYCYCLINE
#       throughout (E-test MIC>=16: CROI 2023 methods table, NEJM Trial Procedures
#       p.1298, Appendix Table 2). "Tetracycline" is only a LABEL — in NEJM's End
#       Points sentence (p.1298), the protocol aims, and downstream CDC/Szondy. Not a
#       measurement switch, not concealment (tetracycline is the broader surrogate;
#       doxycycline the more conservative measure). Only N. gonorrhoeae is tetracycline
#       -tested. [2026-08-19 correction, PI review: the earlier "pre-specified
#       tetracycline endpoint that got switched" over-read this; there was never a
#       tetracycline-S.-aureus measurement. CROI source: croi2023_luetkemeyer_OA3.md.]
unit: doxypep_us
trial_name: DoxyPEP
citation: "Luetkemeyer AF, et al. N Engl J Med 2023;388:1296-1306"
doi: "10.1056/NEJMoa2211934"
registry_id: NCT03980223
source_file: luetkemeyer2023_nejm_doxypep.pdf
coder: claude-firstpass
code_date: "2026-08-18"

s_aureus_measured:
  value: "yes"
  locator: "p. 1298 (Methods, Laboratory Methods)"
  quote: >-
    Swabs of the nares and oropharynx were obtained at baseline, 6 months, and 12
    months for Staphylococcus aureus culture and doxycycline-resistance testing,
    with resistance defined as an MIC of 16 ug per milliliter or greater by ETEST.

powered_for_resistance_endpoint:
  value: "no"
  locator: "p. 1298 (outcomes) / p. 1303 (Antimicrobial Resistance)"
  note: >-
    Resistance was a secondary antimicrobial-resistance outcome; no power
    calculation is stated for any resistance endpoint. 'no' means 'not stated'.

authors_concede_underpowering:
  value: "partial"
  locator: "p. 1303 (Antimicrobial Resistance)"
  quote: "Cultures were limited owing to an inability to collect culture before gonorrhea treatment in half the participants as well as a lack of culture growth"
  note: >-
    The concession is explicit for the gonococcal resistance endpoint (low culture
    numbers), not for S. aureus, which had ample isolates (215 at baseline).

conclusion_contested:
  value: "no"
  locator: "p. 1303-1304 (Discussion)"
  note: >-
    No published reanalysis reaches a different conclusion from DoxyPEP's own
    S. aureus data. CDC's non-reconciliation is recorded at the observation level;
    DOXYVAC's contest (Vanbaelen 2024c) belongs to the DOXYVAC record.

selection_level_tested: individual
selection_level_locator: "p. 1297-1298 (individually randomized RCT, 2:1)"

body_site:
  value: "yes"
  locator: "p. 1298 (Methods)"
  quote: "nares and oropharynx"
identification_method:
  value: "yes"
  locator: "p. 1298 (Methods)"
  quote: "Staphylococcus aureus culture"
susceptibility_method:
  value: "yes"
  locator: "p. 1298 (Methods); Fig 4B caption p. 1301"
  quote: "doxycycline resistance by ETEST (bioMerieux)"
breakpoint_standard:
  value: "partial"
  locator: "p. 1298; Szondy 2024 Table 2 footnote"
  quote: "resistance defined as an MIC of 16 ug per milliliter or greater by ETEST"
  note: >-
    NEJM does not cite a CLSI/EUCAST source for the S. aureus doxycycline >=16
    cutoff (Szondy notes DoxyPEP used CLSI 2 mg/L for the GONOCOCCAL tetracycline
    endpoint only). Partial: value recorded, standard not fully attributable.
breakpoint_value:
  value: "yes"
  locator: "p. 1298; Fig 4B caption p. 1301"
  quote: "doxycycline MIC >=16 ug/mL (ETEST)"

# The evidentiary-adequacy floor: the individual-level data is explicitly withheld,
# so the S. aureus phenotype/denominator discrepancies below cannot be adjudicated
# by re-analysis. Data-sharing statement (posted 2023-04-06 at NEJM.org).
data_availability:
  value: "no"
  locator: "Data Sharing Statement (nejmoa2211934_data-sharing.pdf), posted 2023-04-06"
  quote: >-
    Will the data collected for your study be made available to others? No.
  note: >-
    Every downstream field of the statement (which data, mechanism, supporting
    documents, restrictions) is an em-dash. No data, no protocol-for-sharing, no
    mechanism. The pivotal trial underpinning doxy-PEP guidelines shares nothing.

# The S. aureus assay was DOXYCYCLINE throughout (E-test MIC>=16): CROI 2023 methods
# table, NEJM Trial Procedures p.1298, and NEJM Appendix Table 2 all agree. There was
# never a tetracycline-S.-aureus measurement. "Tetracycline" appears only as a LABEL:
# in NEJM's End Points sentence (p.1298), in the protocol aims wording, and in the
# downstream CDC/Szondy retellings. So this is a labeling inconsistency, not a
# measurement switch, and not concealment (tetracycline is the broader surrogate;
# doxycycline is the more conservative measure). Only N. gonorrhoeae is tested for
# tetracycline (TCN-R agar dilution). CROI source: croi2023_luetkemeyer_OA3.md.
saureus_endpoint_label_mismatch:
  value: "yes"
  locator: "NEJM End Points p.1298 vs Trial Procedures p.1298; CROI 2023 methods table; Appendix Table 2"
  quote: >-
    NEJM End Points (p.1298): 'The primary antimicrobial-resistance outcomes were
    tetracycline resistance in N. gonorrhoeae and S. aureus ...' — but NEJM Trial
    Procedures (same p.1298) and the CROI 2023 methods table both define the S. aureus
    assay as DOXYCYCLINE resistance, 'MIC of 16 ug per milliliter or greater by ETEST'.
    Only N. gonorrhoeae is tested for tetracycline (CROI: 'TCN-R MIC >= 2.0 by agar
    dilution').
  note: >-
    The relabel ORIGINATES in the trial's own CROI 2023 abstract TABLE CAPTION:
    'Bacterial isolation and phenotypic resistance to the TETRACYCLINE ANTIBIOTIC
    CLASS' — printed over columns whose S. aureus and commensal Neisseria assays are
    DOXYCYCLINE (E-test MIC>=16 and >=2) and only GC is tetracycline (agar dilution).
    The trial pools three organisms and two drugs under one 'tetracycline class'
    heading. NEJM's End Points sentence carries the same loose label; CDC and Szondy
    inherit it downstream onto the doxycycline numbers. The S. aureus assay is
    doxycycline in EVERY methods source (CROI table, NEJM Trial Procedures, Appendix
    Table 2). Labeling inconsistency, NOT a measurement switch (no tetracycline-S.-
    aureus assay exists) and NOT concealment (tetracycline is the broader surrogate:
    tet(K)=tetracycline-R but doxycycline-S, Grossman 2016; doxycycline is the more
    conservative measure). See CDC observation rows + croi2023_luetkemeyer_OA3.md.

