      Szondy is a SYSTEMATIC REVIEW & META-ANALYSIS (Semmelweis; IJID 2024) — Table 2 is pooled EXTRACTION of the underlying trials, not an independent observation. Tagged secondary_synthesis: it reconciles to NEJM by construction (a second reading of the same data), so it is a reconciliation CHECK, not corroboration. RECONCILES to NEJM: doxy follow-up MSSA 15/71 + MRSA 1/11 = 16/82 = NEJM
