  # ---------- Szondy 2024 (meta-analysis): DERIVED from NEJM/CROI; reconciles ----------
  - source_type: meta_analysis
    source_citation: "Szondy 2024 Table 2 (Int J Infect Dis 147:107186)"
    arm: doxy
    timepoint: followup_mo6_mo12_pooled
    organism: mssa
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: standard_breakpoint
    numerator: 15
    denominator: 71
    denominator_basis: isolates_cultured
    locator: "Szondy Table 2, p. 6 (DoxyPEP, S. aureus MSSA)"
    note: >-
      RECONCILES to NEJM: doxy follow-up MSSA 15/71 + MRSA 1/11 = 16/82 = NEJM
      months 6+12 pooled (11+5 resistant / 51+31 isolated). Relabel: Szondy's table
      is 'Tetracycline resistance' and labels this 'TCN resistance ... MIC >=16',
      but MIC>=16 is NEJM's DOXYCYCLINE ETEST cutoff. The MSSA/MRSA split is not in
      NEJM main text; it traces to the CROI 2023 abstract (Szondy ref 17); NEJM
      Supplementary Appendix not checked (not in hand).
  - source_type: meta_analysis
    source_citation: "Szondy 2024 Table 2"
    arm: doxy
    timepoint: followup_mo6_mo12_pooled
    organism: mrsa
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: standard_breakpoint
    numerator: 1
    denominator: 11
    denominator_basis: isolates_cultured
    locator: "Szondy Table 2, p. 6 (DoxyPEP, S. aureus MRSA)"
    note: >-
      Relabel (TCN vs doxycycline). MRSA breakdown exists ONLY here / CROI; NEJM
      has no methicillin split, so no primary_trial denominator exists for MRSA —
      a finding for detectability, not a gap to fill.
  - source_type: meta_analysis
    source_citation: "Szondy 2024 Table 2"
    arm: control
    timepoint: followup_mo6_mo12_pooled
    organism: mssa
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: standard_breakpoint
    numerator: 3
    denominator: 47
    denominator_basis: isolates_cultured
    locator: "Szondy Table 2, p. 6"
    note: "Relabel. Control follow-up MSSA 3/47 + MRSA 2/6 = 5/53 = NEJM control mo6+12 (3+2 / 29+24)."
  - source_type: meta_analysis
    source_citation: "Szondy 2024 Table 2"
    arm: control
    timepoint: followup_mo6_mo12_pooled
    organism: mrsa
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: standard_breakpoint
    numerator: 2
    denominator: 6
    denominator_basis: isolates_cultured
