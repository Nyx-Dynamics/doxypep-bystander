  # ---------- CDC MMWR (guideline): provenance RESOLVED via CROI 2023 OA-3 ----------
  # 2026-08-19 update, CROI slides now in hand (croi2023_luetkemeyer_OA3.md; PI
  # attended the oral presentation). The CDC 20/428, 28/222 = the CROI S. aureus
  # DOXY-R panel (doxy-PEP arm, baseline & M12) over the ALL-SWABBED denominator
  # (5%x428=20; 13%x222=28). The assay is DOXYCYCLINE (E-test MIC>=16); CDC relabels
  # it 'tetracycline'. TWO findings, both in CDC's own verbatim sentence (MMWR p.5):
  #  (a) RELABEL: 'evaluating tetracycline resistance in S. aureus isolates' — the
  #      assay was doxycycline.
  #  (b) DENOMINATOR MISMATCH / DEFLATION: CDC attributes the rise to 'those with
  #      S. aureus in their nares' (colonized) but divides by all-swabbed 428/222.
  #      CDC printed the colonized counts itself (187, 69), so per-carrier doxy-R is
  #      20/187=11% -> 28/69=41%, ~3x the reported 5%->13%. Doxy-PEP cuts colonization
  #      (44%->31%), inflating the all-swabbed denominator and deflating the rate over
  #      it. This is the PI's point, sitting in the guideline's own numbers.
  # Not a CDC error against NEJM (different venue); it IS a relabel + a self-
  # contradictory denominator. NB the CDC counts (20/428, 28/222) match the CROI
  # SLIDES, not the published CROI abstract TABLE (12/334, 16/137) — even within CROI
  # 2023 the slides and abstract table disagree. M12 doxy-R S. aureus resistant count
  # is reported as 5 (NEJM appendix), 16 (abstract table), or 28 (slides/CDC) — a
  # 5-to-28 range for one endpoint. Full discordance table in the CROI artifact.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: baseline
    organism: s_aureus
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 20
    denominator: 428
    denominator_basis: all_participants_swabbed
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 5 (lines 447-452)"
    note: >-
      CDC verbatim (p.5): 'evaluating tetracycline resistance in S. aureus isolates
      found [a decrease] of S. aureus overall of 14% (from 44% [187 of 428] to 31%
      [69 of 222]), but that those with S. aureus in their nares at 12-month follow-up
      had an increase in tetracycline-resistant S. aureus (from 5% [20 of 428] to 13%
      [28 of 222])'. RESOLVED via CROI 2023 OA-3 (croi2023_luetkemeyer_OA3.md): 20/428
      is the CROI S. aureus DOXY-R panel, doxy-PEP arm baseline, over the ALL-SWABBED
      denominator (5%x428=20). phenotype_measured = doxycycline (E-test MIC>=16, CROI
      methods table); CDC RELABELS it 'tetracycline'. description_denominator_mismatch
      = yes: CDC says the rise is among 'those with S. aureus in their nares' (colon-
      ized) but divides by all-swabbed 428; the colonized denominator CDC itself prints
      is 187, so per-carrier doxy-R is 20/187=11%, not 5%.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: month12
    organism: s_aureus
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 28
    denominator: 222
    denominator_basis: all_participants_swabbed
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 5 (lines 447-452)"
    note: >-
      CDC: '... to 13% [28 of 222]'. RESOLVED: 28/222 is the CROI doxy-R panel, doxy-
      PEP arm M12, over all-swabbed (13%x222=28). phenotype_measured = doxycycline
      (relabeled tetracycline). DEFLATION (the PI's point, in CDC's own numbers): CDC
      attributes the rise to colonized ('those with S. aureus in their nares') but uses
      the all-swabbed 222; the colonized count CDC prints is 69, so per-carrier doxy-R
      is 28/69 = 41%, ~3x the reported 13%. Because doxy-PEP cut colonization 44%->31%,
      the all-swabbed denominator is inflated by the intervention, deflating the rate.
      CROI counts (colonized 69, resistant 28) do NOT reconcile with NEJM Appendix
      Table 2 (colonized 31, resistant 5) — a venue discordance (see CROI artifact).
