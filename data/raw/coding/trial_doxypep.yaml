  # ---------- CDC MMWR (guideline): phenotype narrowed; source still PENDING CROI ----
  # 2026-08-19 update, after obtaining the NEJM Supplementary Appendix + Protocol:
  # NEJM (main text AND appendix, both checked) publishes NO tetracycline-S.-aureus
  # number — S. aureus is reported only as DOXYCYCLINE resistance (Appendix Table 2),
  # while the pre-specified endpoint (Protocol + NEJM End Points p.1298) was
  # tetracycline. So CDC's "tetracycline-resistant S. aureus" REFLECTS the pre-
  # specified tetracycline phenotype NEJM did not publish, and cannot map onto any
  # NEJM table by construction — so it is not a CDC error against NEJM. But do NOT
  # harden this to "resolved": to say the number IS the CROI figure we must see it in
  # the CROI 2023 abstract (not yet in hand). Exact source + the 428/222 denominator
  # remain PENDING that abstract. Do not assert a CDC error either way.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: baseline
    organism: s_aureus
    phenotype_measured: not_stated
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 20
    denominator: 428
    denominator_basis: unclear
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 6 (Potential Resistance in Commensals)"
    note: >-
      CDC prints 'tetracycline-resistant S. aureus ... from 5% [20 of 428]'.
      phenotype_measured = not_stated: CDC does not state the assay. The label
      'tetracycline' matches the PRE-SPECIFIED endpoint (Protocol L253/258/280/498/527;
      NEJM End Points p.1298), which NEJM did NOT publish — S. aureus appears in NEJM
      only as DOXYCYCLINE resistance (Appendix Table 2, verified). So the CDC figure
      REFLECTS the pre-specified tetracycline phenotype NEJM left unpublished, and
      cannot map onto any NEJM table by construction — hence not a CDC error against
