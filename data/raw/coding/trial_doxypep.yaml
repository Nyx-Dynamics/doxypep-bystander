  # ---------- CDC MMWR (guideline): does NOT reconcile to NEJM ----------
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: baseline
    organism: s_aureus
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 20
    denominator: 428
    denominator_basis: unclear
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 6 (Potential Resistance in Commensals)"
    note: >-
      CDC prints 'tetracycline-resistant S. aureus ... from 5% [20 of 428]';
      relabel (NEJM assay is doxycycline ETEST). Basis unclear and does NOT
      reconcile: NEJM baseline is 25/215 (isolated) or 25/483 (swabbed), combined
      arms; CDC's 20/428 matches neither the numerator (25) nor any NEJM
      denominator. Description ('those with S. aureus in their nares') implies a
      colonized denominator, but 428 is all-swabbed magnitude. Do not assert an
      error; record the disagreement.
  - source_type: guideline
    source_citation: "CDC MMWR 2024 (Bachmann)"
    arm: doxy
    timepoint: month12
    organism: s_aureus
    phenotype_measured: doxycycline
    phenotype_as_labeled: tetracycline
    mechanism_discriminating: "no"
    discrimination_method: "none"
    numerator: 28
    denominator: 222
    denominator_basis: unclear
    description_denominator_mismatch: "yes"
    locator: "CDC MMWR p. 6"
    note: >-
      CDC: 'to 13% [28 of 222]'. Relabel (tetracycline vs NEJM doxycycline). Does
      NOT reconcile: NEJM month-12 doxy is 5 resistant / 31 isolated / 111 swabbed;
      CDC's 28/222 matches neither numerator (28 vs 5) nor denominator (222 vs
      31/111). The guideline driving national practice is the one source that does
      not reconcile to the isolate; Szondy (meta-analysis) does.
