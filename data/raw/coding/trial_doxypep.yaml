# Stream A coded trial — DoxyPEP (Luetkemeyer 2023). First-pass (claude-firstpass);
# needs PI verification + double-coding (Phase F). Values quoted (YAML booleans).
#
# NEJM measured DOXYCYCLINE resistance in S. aureus (ETEST, MIC >=16 ug/mL); the
# relabel to "tetracycline" happens downstream (Szondy's table title, CDC). NEJM
# S. aureus counts are read from Fig 4B stacked bars (bar = % isolated of swabbed;
# dark = % doxy-resistant) and cross-check against the text percentages exactly:
# baseline 215/483=45%, 25/215=12%; doxy mo12 31/111=28%, 5/31=16%, 5/111=5%;
# SC mo12 24/51=47%, 2/24=8%. See DECISIONS.md.
unit: doxypep_us
trial_name: DoxyPEP
citation: "Luetkemeyer AF, et al. N Engl J Med 2023;388:1296-1306"
doi: "10.1056/NEJMoa2211934"
registry_id: NCT03980223
source_file: luetkemeyer2023_nejm_doxypep.pdf
coder: claude-firstpass
code_date: "2026-08-18"

s_aureus_measured:
  value: "yes"
  locator: "p. 1298 (Methods, Laboratory Methods)"
  quote: >-
    Swabs of the nares and oropharynx were obtained at baseline, 6 months, and 12
    months for Staphylococcus aureus culture and doxycycline-resistance testing,
    with resistance defined as an MIC of 16 ug per milliliter or greater by ETEST.

powered_for_resistance_endpoint:
  value: "no"
  locator: "p. 1298 (outcomes) / p. 1303 (Antimicrobial Resistance)"
  note: >-
    Resistance was a secondary antimicrobial-resistance outcome; no power
    calculation is stated for any resistance endpoint. 'no' means 'not stated'.

authors_concede_underpowering:
  value: "partial"
  locator: "p. 1303 (Antimicrobial Resistance)"
  quote: "Cultures were limited owing to an inability to collect culture before gonorrhea treatment in half the participants as well as a lack of culture growth"
  note: >-
    The concession is explicit for the gonococcal resistance endpoint (low culture
    numbers), not for S. aureus, which had ample isolates (215 at baseline).

conclusion_contested:
  value: "no"
  locator: "p. 1303-1304 (Discussion)"
  note: >-
    No published reanalysis reaches a different conclusion from DoxyPEP's own
    S. aureus data. CDC's non-reconciliation is recorded at the observation level;
    DOXYVAC's contest (Vanbaelen 2024c) belongs to the DOXYVAC record.

selection_level_tested: individual
selection_level_locator: "p. 1297-1298 (individually randomized RCT, 2:1)"

body_site:
  value: "yes"
  locator: "p. 1298 (Methods)"
  quote: "nares and oropharynx"
identification_method:
  value: "yes"
  locator: "p. 1298 (Methods)"
  quote: "Staphylococcus aureus culture"
susceptibility_method:
  value: "yes"
  locator: "p. 1298 (Methods); Fig 4B caption p. 1301"
  quote: "doxycycline resistance by ETEST (bioMerieux)"
breakpoint_standard:
  value: "partial"
  locator: "p. 1298; Szondy 2024 Table 2 footnote"
  quote: "resistance defined as an MIC of 16 ug per milliliter or greater by ETEST"
  note: >-
    NEJM does not cite a CLSI/EUCAST source for the S. aureus doxycycline >=16
    cutoff (Szondy notes DoxyPEP used CLSI 2 mg/L for the GONOCOCCAL tetracycline
    endpoint only). Partial: value recorded, standard not fully attributable.
breakpoint_value:
  value: "yes"
  locator: "p. 1298; Fig 4B caption p. 1301"
  quote: "doxycycline MIC >=16 ug/mL (ETEST)"

observations:

