[pytest]
# never descend into build/deposit staging (e.g. an extracted deposit tarball), which would
# duplicate test basenames and break collection.
norecursedirs = submission .venv* .git data
markers =
    slow: computationally heavy (exact-Fisher rejection-region enumeration; Monte-Carlo
        Type-I / parametric-bootstrap model selection). Skipped by `pytest -m "not slow"`;
        run alone with `pytest -m slow`. `make all` runs the full suite (slow included).
